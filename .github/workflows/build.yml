name: Build and release TCost
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tcost-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check route evaluator
        run: bash scripts/test-core.sh
      - name: Format and build reobfuscated mod
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon spotlessApply build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tcost-build
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Publish tested alpha build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=0.1.0-alpha.1
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "TCost 0.1.0 alpha 1" --notes-file docs/RELEASE.md
          fi
          gh release upload "$tag" build/libs/*.jar --clobber
